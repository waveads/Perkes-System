<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveAds Perks — Business</title>
<link rel="stylesheet" href="styles.css">
<style>
  .month-nav { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .month-nav h2 { margin:0; font-size:1.1rem; flex:1; text-align:center; }
  .week-block { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:10px; }
  .week-block-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; cursor:pointer; }
  .week-block-header:hover { background:var(--surface-2); }
  .week-block-body { padding:14px 16px; display:none; border-top:0.5px solid var(--border); }
  .week-block-body.open { display:block; }
  .current-week-marker { border-left:3px solid var(--teal); }
</style>
</head>
<body>

<div class="app-shell" style="max-width:600px;">
  <div class="topbar">
    <div class="brand">
      <div class="logo" id="logoSlot"></div>
      <span class="brand-text">WaveAds Perks</span>
    </div>
  </div>

  <div class="page-header">
    <div>
      <h1 id="bizName">—</h1>
      <p class="subtitle">Driver perk tracker</p>
    </div>
  </div>

  <div class="grid" id="statsGrid"></div>

  <div id="content"><div class="loading"><div class="spinner"></div>Loading...</div></div>
</div>

<script src="config.js"></script>
<script>
document.getElementById('logoSlot').innerHTML = LOGO_SVG;

const params = new URLSearchParams(location.search);
const businessId = params.get('id');

let allAssignments = [];
let business = null;
let currentMonth = todayYearMonth();

function todayYearMonth() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
}

function getWeekKey(date) {
  const d = new Date(date);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const diff = (d - jan1) / 86400000;
  const week = Math.ceil((diff + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}

function getCurrentWeek() { return getWeekKey(new Date()); }

function weekBounds(weekKey) {
  const m = weekKey.match(/(\d+)-W(\d+)/);
  const year = parseInt(m[1]), week = parseInt(m[2]);
  const jan1 = new Date(year, 0, 1);
  const monday = new Date(jan1);
  monday.setDate(jan1.getDate() + (week-1)*7 - jan1.getDay() + 1);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function weeksInMonth(yearMonth) {
  const [year, month] = yearMonth.split('-').map(Number);
  const weeks = [], seen = new Set();
  const days = new Date(year, month, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const key = getWeekKey(new Date(year, month-1, d));
    if (!seen.has(key)) { seen.add(key); weeks.push(key); }
  }
  return weeks;
}

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
}

function prevMonth(ym) {
  let [y, m] = ym.split('-').map(Number);
  m--; if (m < 1) { m = 12; y--; }
  return `${y}-${String(m).padStart(2,'0')}`;
}
function nextMonth(ym) {
  let [y, m] = ym.split('-').map(Number);
  m++; if (m > 12) { m = 1; y++; }
  return `${y}-${String(m).padStart(2,'0')}`;
}

async function load() {
  if (!businessId) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><h3>No business specified</h3></div>';
    return;
  }
  const CURRENT_WEEK = getCurrentWeek();
  const res = await apiCall('getBusinessView', { businessId, week: CURRENT_WEEK });
  if (!res.ok) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><h3>Could not load data</h3><p>' + escapeHtml(res.error || '') + '</p></div>';
    return;
  }
  business = res.business;
  allAssignments = res.assignments || [];
  document.getElementById('bizName').textContent = business.name;

  const redeemed = allAssignments.filter(a => a.status === 'redeemed').length;
  const pending  = allAssignments.filter(a => a.status === 'available').length;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Current perk</div><div class="stat-value" style="font-size:1rem;">${escapeHtml(business.perk)}</div></div>
    <div class="stat-card"><div class="stat-label">Total redeemed</div><div class="stat-value teal">${redeemed}</div></div>
    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value amber">${pending}</div></div>`;

  render();
}

function render() {
  const CURRENT_WEEK = getCurrentWeek();
  const weeks = weeksInMonth(currentMonth);

  let html = `<div class="month-nav">
    <button class="btn btn-sm btn-ghost" id="prevBtn">‹</button>
    <h2>${monthLabel(currentMonth)}</h2>
    <button class="btn btn-sm btn-ghost" id="nextBtn">›</button>
  </div>`;

  weeks.forEach(wk => {
    const { monday, sunday } = weekBounds(wk);
    const isCurrent = wk === CURRENT_WEEK;
    const a = allAssignments.find(x => x.week === wk);
    const isRedeemed = a && a.status === 'redeemed';
    const isAvailable = a && a.status === 'available';

    html += `<div class="week-block${isCurrent ? ' current-week-marker' : ''}">
      <div class="week-block-header" data-toggle="${wk}">
        <div>
          <div style="font-weight:700; font-size:0.9rem;">${isCurrent ? '★ This week' : wk} <span style="font-weight:400; color:var(--text-soft); font-size:0.8rem;">${fmtDate(monday)} – ${fmtDate(sunday)}</span></div>
          <div style="margin-top:4px;">
            ${!a ? '<span style="font-size:0.75rem; color:var(--text-dim);">No assignment</span>' : ''}
            ${isAvailable ? '<span class="pill pill-available" style="font-size:0.65rem; padding:2px 8px;">Available</span>' : ''}
            ${isRedeemed ? '<span class="pill pill-redeemed" style="font-size:0.65rem; padding:2px 8px;">Redeemed</span>' : ''}
          </div>
        </div>
        <span style="color:var(--text-dim);" id="chev-${wk}">${isCurrent ? '▾' : '▸'}</span>
      </div>
      <div class="week-block-body${isCurrent ? ' open' : ''}" id="body-${wk}">`;

    if (!a) {
      html += `<p style="color:var(--text-soft); font-size:0.88rem; margin:0;">No driver assigned for this week.</p>`;
    } else {
      html += `<div class="card-row" style="margin-bottom:10px;">
        <div>
          <p class="card-title">${escapeHtml(a.driverName)}</p>
          <p class="card-sub">${escapeHtml(business.perk)}</p>
        </div>
        <span class="pill ${isRedeemed ? 'pill-redeemed' : 'pill-available'}">${isRedeemed ? 'Redeemed' : 'Available'}</span>
      </div>`;

      if (isRedeemed) {
        html += `<p class="hint success">Redeemed ${new Date(a.redeemedAt).toLocaleString()}</p>`;
      } else if (isCurrent) {
        html += `<button class="btn btn-primary" style="margin-top:8px;" id="redeemBtn-${wk}" data-assignment="${a.id}">Confirm redemption</button>
          <p class="hint" id="redeem-msg-${wk}" style="margin-top:6px;"></p>`;
      } else {
        html += `<p class="hint" style="color:var(--red);">Expired — not redeemed.</p>`;
      }
    }

    html += `</div></div>`;
  });

  document.getElementById('content').innerHTML = html;

  document.getElementById('prevBtn').addEventListener('click', () => { currentMonth = prevMonth(currentMonth); render(); });
  document.getElementById('nextBtn').addEventListener('click', () => { currentMonth = nextMonth(currentMonth); render(); });

  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const wk = el.dataset.toggle;
      const body = document.getElementById('body-' + wk);
      const ch = document.getElementById('chev-' + wk);
      ch.textContent = body.classList.toggle('open') ? '▾' : '▸';
    });
  });

  // Redeem buttons
  document.querySelectorAll('[id^="redeemBtn-"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.assignment;
      const wk = btn.id.replace('redeemBtn-', '');
      const msg = document.getElementById('redeem-msg-' + wk);
      btn.disabled = true; btn.textContent = 'Confirming...';
      const res = await apiCall('redeem', { id });
      if (res.ok) {
        load();
      } else {
        msg.textContent = res.error || 'Could not confirm. Try again.';
        msg.className = 'hint error';
        btn.disabled = false; btn.textContent = 'Confirm redemption';
      }
    });
  });
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
